<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Reportes Financieros - Ferretería Luis</ui:define>
    <ui:define name="pageTitle">Módulo de Reportes</ui:define>
    <ui:define name="pageSubtitle">Análisis financiero y rendimiento de ventas</ui:define>

    <f:metadata>
        <f:viewAction action="#{ManagerReportes.cargarReportes()}" />
    </f:metadata>

    <ui:define name="topActions">
        <h:form>
            <p:commandButton value="Actualizar Reporte" action="#{ManagerReportes.cargarReportes()}"
                update=":reportTable :statsPanel" icon="pi pi-refresh" styleClass="btn-update" />
        </h:form>
    </ui:define>

    <ui:define name="content">
        <h:panelGroup id="statsPanel" layout="block" styleClass="stats-grid">
            <div class="stat-card sales">
                <i class="pi pi-dollar icon-bg"></i>
                <h3>Ventas Totales</h3>
                <span class="value">$<h:outputText value="#{ManagerReportes.totalVentas}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputText></span>
                <div style="font-size: 0.85rem; opacity: 0.8;">Ingresos brutos acumulados</div>
            </div>

            <div class="stat-card profit">
                <i class="pi pi-chart-bar icon-bg"></i>
                <h3>Ganancia Neta</h3>
                <span class="value">$<h:outputText value="#{ManagerReportes.totalGanancias}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputText></span>
                <div style="font-size: 0.85rem; opacity: 0.8;">Margen operativo real</div>
            </div>
        </h:panelGroup>

        <div class="premium-card">
            <h:form id="reportForm">
                <div class="card-header" style="flex-wrap: wrap; gap: 15px;">
                    <div>
                        <h2 style="margin:0; font-size: 1.25rem;">Registro de Transacciones</h2>
                        <p style="margin:5px 0 0; color:var(--text-muted); font-size: 0.9rem;">Detalle individual por
                            producto vendido</p>
                    </div>

                    <!-- Filtro de Fechas -->
                    <div
                        style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.05); padding: 5px 15px; border-radius: 8px;">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <h:outputLabel value="Desde:" style="font-weight: 600; font-size: 0.85rem;" />
                            <p:datePicker value="#{ManagerReportes.fechaInicio}" pattern="dd/MM/yyyy" showIcon="true"
                                size="10" />
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <h:outputLabel value="Hasta:" style="font-weight: 600; font-size: 0.85rem;" />
                            <p:datePicker value="#{ManagerReportes.fechaFin}" pattern="dd/MM/yyyy" showIcon="true"
                                size="10" />
                        </div>
                        <p:commandButton action="#{ManagerReportes.cargarReportes()}" update=":reportTable :statsPanel"
                            icon="pi pi-search" styleClass="rounded-button ui-button-info ui-button-flat"
                            title="Filtrar" />
                    </div>

                    <div class="export-btns" style="margin-left: auto;">
                        <p:commandButton value="PDF" icon="pi pi-file-pdf" styleClass="btn-export-pdf"
                            style="margin-right: 10px;">
                            <p:dataExporter type="pdf" target="reportTable" fileName="Reporte_Ventas_Ferreteria"
                                pageOnly="false" />
                        </p:commandButton>
                        <p:commandButton value="Excel" icon="pi pi-file-excel" styleClass="btn-export-excel">
                            <p:dataExporter type="xlsx" target="reportTable" fileName="Reporte_Ventas_Ferreteria" />
                        </p:commandButton>
                    </div>
                </div>

                <p:dataTable id="reportTable" value="#{ManagerReportes.listaDetalles}" var="det" rows="10"
                    paginator="true" paginatorPosition="bottom"
                    paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                    currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}">

                    <p:column headerText="Fecha Operación" sortBy="#{det.venta.fecha_venta}" style="width: 15%">
                        <h:outputText value="#{det.venta.fecha_venta}">
                            <f:convertDateTime pattern="dd MMM yyyy" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Producto" filterBy="#{det.producto.nom_producto}" filterMatchMode="contains"
                        style="width: 30%">
                        <h:outputText value="#{det.producto.nom_producto}" />
                    </p:column>

                    <p:column headerText="Cant." style="text-align: center; width: 10%">
                        <h:outputText value="#{det.cantidad}">
                            <f:convertNumber pattern="#,##0.##" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Venta Unit." style="width: 15%">
                        <h:outputText value="#{det.precio_unitario}">
                            <f:convertNumber currencySymbol="$" type="currency" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Subtotal" style="width: 15%">
                        <h:outputText value="#{det.subtotal}">
                            <f:convertNumber currencySymbol="$" type="currency" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Utilidad" style="width: 15%">
                        <h:outputText value="#{ManagerReportes.calcularGananciaItem(det)}">
                            <f:convertNumber currencySymbol="$" type="currency" />
                        </h:outputText>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
