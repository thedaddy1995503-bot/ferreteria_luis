<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Clientes - Ferretería Luis</ui:define>
    <ui:define name="pageTitle">Gestión de Clientes</ui:define>
    <ui:define name="pageSubtitle">Registro de clientes habituales</ui:define>

    <ui:define name="content">
        <div class="premium-card" style="max-width: 700px; margin: 0 auto;">
            <div class="card-header">
                <h2 style="margin:0; font-size: 1.25rem;">Formulario de Registro</h2>
            </div>

            <h:form id="formClientes">
                <p:growl id="msgs" showDetail="true" />

                <div class="ui-fluid">
                    <div class="field" style="margin-bottom: 20px;">
                        <p:outputLabel for="nombre" value="Nombre Completo:" style="font-weight: 600;" />
                        <p:inputText id="nombre" value="#{ManagerClientes.clientes.nombres}" required="true"
                            placeholder="Ej. Juan Pérez" />
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="field">
                            <p:outputLabel for="dui" value="DUI:" style="font-weight: 600;" />
                            <p:inputMask id="dui" value="#{ManagerClientes.clientes.dui}" mask="99999999-9"
                                required="true" />
                        </div>
                        <div class="field">
                            <p:outputLabel for="tel" value="Teléfono:" style="font-weight: 600;" />
                            <p:inputMask id="tel" value="#{ManagerClientes.clientes.tel}" mask="9999-9999" />
                        </div>
                    </div>

                    <div class="field" style="margin-bottom: 25px;">
                        <p:outputLabel for="dir" value="Dirección:" style="font-weight: 600;" />
                        <p:inputTextarea id="dir" value="#{ManagerClientes.clientes.direccion}" rows="2" />
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 15px;">
                        <p:button value="Ver Lista" outcome="ListaClientes" icon="pi pi-list"
                            styleClass="ui-button-secondary ui-button-flat" />
                        <p:commandButton value="Registrar Cliente" action="#{ManagerClientes.guardarClientes()}"
                            update="@form" icon="pi pi-user-plus" styleClass="ui-button-primary"
                            style="padding: 10px 30px;" />
                    </div>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
