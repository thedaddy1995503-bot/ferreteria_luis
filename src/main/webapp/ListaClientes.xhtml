<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Clientes - Ferretería Luis</ui:define>
    <ui:define name="pageTitle">Catálogo de Clientes</ui:define>
    <ui:define name="pageSubtitle">Historial y datos de contacto</ui:define>

    <ui:define name="topActions">
        <h:form>
            <p:button value="Nuevo Cliente" outcome="Clientes" icon="pi pi-user-plus" styleClass="ui-button-primary" />
        </h:form>
    </ui:define>

    <ui:define name="content">
        <div class="premium-card">
            <h:form id="form">
                <p:growl id="msgs" showDetail="true" />

                <p:dataTable id="dt-clients" widgetVar="dtClients" var="client" value="#{ManagerClientes.listaClientes}"
                    reflow="true" styleClass="clients-table" rowKey="#{client.id_cliente}" paginator="true" rows="10"
                    paginatorPosition="bottom">

                    <f:facet name="header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: bold">CLIENTES REGISTRADOS</span>
                            <span class="filter-container ui-input-icon-left">
                                <i class="pi pi-search"></i>
                                <p:inputText id="globalFilter" onkeyup="PF('dtClients').filter()"
                                    placeholder="Buscar cliente..." />
                            </span>
                        </div>
                    </f:facet>

                    <p:column headerText="Nombre" sortBy="#{client.nombres}" filterBy="#{client.nombres}"
                        filterMatchMode="contains">
                        <div style="display: flex; align-items: center;">
                            <p:avatar icon="pi pi-user" shape="circle"
                                style="margin-right: 10px; background: #f1f5f9;" />
                            <h:outputText value="#{client.nombres}"
                                style="font-weight: 600; color: var(--primary-dark);" />
                        </div>
                    </p:column>

                    <p:column headerText="DUI" sortBy="#{client.dui}">
                        <h:outputText value="#{client.dui}" />
                    </p:column>

                    <p:column headerText="Teléfono">
                        <h:outputText value="#{client.tel}" />
                    </p:column>

                    <p:column headerText="Dirección">
                        <h:outputText value="#{client.direccion}"
                            style="font-size: 0.9rem; color: var(--text-muted);" />
                    </p:column>

                    <p:column exportable="false" style="width: 10%; text-align: center;">
                        <p:commandButton icon="pi pi-pencil" oncomplete="PF('manageClientDialog').show()"
                            styleClass="edit-button rounded-button ui-button-success ui-button-flat" process="@this"
                            update=":form:msgs">
                            <f:setPropertyActionListener value="#{client}" target="#{ManagerClientes.clientes}" />
                        </p:commandButton>
                        <p:commandButton class="ui-button-warning rounded-button ui-button-flat" icon="pi pi-trash"
                            process="@this" action="#{ManagerClientes.eliminarCliente(client.id_cliente)}"
                            update="@form">
                            <p:confirm header="Confirmación" message="¿Eliminar este cliente?"
                                icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
