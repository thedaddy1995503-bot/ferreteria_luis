<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso - Ferretería Luis</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&amp;display=swap"
        rel="stylesheet" />

    <style type="text/css">
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #50ff9d;
            --dark-bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.8);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: rgba(39, 39, 42, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated background blobs */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(-20%, -20%) scale(1);
            }

            to {
                transform: translate(20%, 20%) scale(1.2);
            }
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area img {
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* PrimeFaces Input Overrides */
        .ui-inputfield {
            background: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            color: white !important;
            padding: 12px 16px !important;
            font-family: 'Inter', sans-serif !important;
            transition: all 0.2s !important;
            width: 100% !important;
        }

        .ui-inputfield:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2) !important;
            background: rgba(39, 39, 42, 0.8) !important;
        }

        .ui-password {
            width: 100% !important;
        }

        .field-container {
            text-align: left;
            margin-bottom: 20px;
        }

        .field-container label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .login-btn {
            width: 100%;
            padding: 14px !important;
            border-radius: 12px !important;
            background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
            border: none !important;
            color: white !important;
            font-weight: 700 !important;
            font-size: 15px !important;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 210, 255, 0.2) !important;
            transition: transform 0.2s, box-shadow 0.2s !important;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 210, 255, 0.3) !important;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* Customizing the Eye icon for p:password toggleMask */
        .ui-password-info {
            display: none !important;
            /* Hide strength info */
        }

        .ui-inputgroup-addon {
            background: transparent !important;
            border: none !important;
            color: var(--text-muted) !important;
        }
    </style>
</h:head>
<h:body>
    <div class="blob"></div>

    <div class="login-card">
        <header class="logo-area">
            <img src="recursos-web/iniciar.png" alt="Logo" width="80" height="80" />
            <div class="login-header">
                <h1>Bienvenido de nuevo</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>
        </header>

        <h:form id="loginForm">
            <p:growl id="growl" showDetail="true" />

            <div class="field-container">
                <label>Usuario</label>
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon"><i class="pi pi-user"></i></span>
                    <p:inputText id="inputUsuario" value="#{ManagerUsuario.nomUsuario}" required="true"
                        placeholder="Nombre de usuario" />
                </div>
            </div>

            <div class="field-container">
                <label>Contraseña</label>
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon"><i class="pi pi-lock"></i></span>
                    <p:password id="password" value="#{ManagerUsuario.contras}" required="true" placeholder="••••••••"
                        toggleMask="true" redisplay="true" />
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 25px;">
                <a href="#" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">¿Olvidaste tu
                    contraseña?</a>
            </div>

            <p:commandButton action="#{ManagerUsuario.login()}" value="ENTRAR AL SISTEMA" update="growl"
                styleClass="login-btn" />

            <div class="footer-links">
                <span>¿No tienes acceso? </span>
                <a href="#">Contacta al administrador</a>
            </div>
        </h:form>
    </div>
</h:body>

</html>
