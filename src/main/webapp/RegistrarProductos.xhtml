<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Registrar Producto - Ferretería Luis</ui:define>
    <ui:define name="pageTitle">Gestión de Inventario</ui:define>
    <ui:define name="pageSubtitle">Registro de nuevos productos al catálogo</ui:define>

    <ui:define name="content">
        <div class="premium-card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h2 style="margin:0; font-size: 1.25rem;">Formulario de Registro</h2>
            </div>

            <h:form id="registroProductoForm">
                <p:growl id="mensajes" showDetail="true" life="6000" />
                <h:panelGroup rendered="#{not empty ManagerProductos.mensaje}" styleClass="status-pill"
                    style="display:block; margin-bottom:20px; text-align:center; padding: 15px; background: #dcfce7; color: #166534; border-radius: 12px;">
                    <h:outputText value="#{ManagerProductos.mensaje}" />
                </h:panelGroup>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <p:outputLabel for="nombre" value="Nombre del Producto:"
                            style="font-weight: 600; display:block; margin-bottom:8px;" />
                        <p:autoComplete id="nombre" value="#{ManagerProductos.productos.nom_producto}" required="true"
                            style="width: 100%;" placeholder="Ej. Martillo 16oz" 
                            completeMethod="#{ManagerProductos.sugerirNombresProductos}">
                            <p:ajax event="itemSelect" listener="#{ManagerProductos.onProductoSelect}" update="@form" />
                            <p:ajax event="keyup" listener="#{ManagerProductos.verificarHierro}"
                                update="camposHierro" />
                        </p:autoComplete>
                        <p:message for="nombre" />
                    </div>

                    <div class="form-group">
                        <p:outputLabel for="medida" value="Medida / Unidad:"
                            style="font-weight: 600; display:block; margin-bottom:8px;" />
                        <p:selectOneMenu id="medida" value="#{ManagerProductos.productos.medida}"
                            converter="medidaConverter" required="true" style="width: 100%;">
                            <f:selectItem itemLabel="Seleccione medida" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{ManagerProductos.listaMedidas}" var="m" itemLabel="#{m.nombre}"
                                itemValue="#{m}" />
                            <p:ajax event="change" listener="#{ManagerProductos.verificarHierro}"
                                update="camposHierro" />
                        </p:selectOneMenu>
                        <p:message for="medida" />
                    </div>
                </div>

                <h:panelGroup id="camposHierro">
                    <h:panelGroup rendered="#{ManagerProductos.mostrarCamposHierro}"
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px dashed var(--accent-blue);">
                        <div class="form-group">
                            <p:outputLabel for="precioUnitarioHierro" value="Precio unitario (Varilla):"
                                style="font-weight: 600;" />
                            <p:inputNumber id="precioUnitarioHierro" modifyValueOnWheel="false"
                                value="#{ManagerProductos.productos.precio_unitario}" symbol="$" style="width: 100%;" />
                        </div>
                        <div class="form-group">
                            <p:outputLabel for="unidadesQuintalHierro" value="Varillas por quintal:"
                                style="font-weight: 600;" />
                            <p:inputNumber id="unidadesQuintalHierro" modifyValueOnWheel="false"
                                value="#{ManagerProductos.productos.unidadxmedida}" decimalPlaces="0"
                                style="width: 100%;" />
                        </div>
                    </h:panelGroup>
                </h:panelGroup>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                    <div class="form-group">
                        <p:outputLabel for="categoria" value="Categoría:" style="font-weight: 600;" />
                        <p:inputText id="categoria" value="#{ManagerProductos.productos.categoria}" required="true"
                            style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="stock" value="Stock Inicial:" style="font-weight: 600;" />
                        <p:inputNumber id="stock" value="#{ManagerProductos.productos.stock}" required="true" modifyValueOnWheel="false"
                            style="width: 100%;" />
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                    <div class="form-group">
                        <p:outputLabel for="precioManual" value="Precio de Compra:" style="font-weight: 600;" />
                        <p:inputNumber id="precioManual" value="#{ManagerProductos.productos.precio_compra}" modifyValueOnWheel="false"
                            required="true" symbol="$" style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="precio" value="Precio de Venta:" style="font-weight: 600;" />
                        <p:inputNumber id="precio" value="#{ManagerProductos.productos.precio}" required="true" modifyValueOnWheel="false"
                            symbol="$" style="width: 100%;" />
                    </div>
                </div>

                <div class="form-group" style="margin-top:20px;">
                    <p:outputLabel for="descripcion" value="Descripción:" style="font-weight: 600;" />
                    <p:inputTextarea id="descripcion" value="#{ManagerProductos.productos.descripcion}" rows="3"
                        style="width: 100%;" />
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 15px;">
                    <p:button value="Cancelar" outcome="dashboard" icon="pi pi-times"
                        styleClass="ui-button-secondary ui-button-flat" />
                    <p:commandButton value="Guardar Producto" action="#{ManagerProductos.guardarProducto()}"
                        update="@form" icon="pi pi-check" styleClass="ui-button-primary" style="padding: 10px 30px;" />
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
