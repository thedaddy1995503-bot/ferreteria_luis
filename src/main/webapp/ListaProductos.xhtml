<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Inventario - Ferretería Luis</ui:define>
    <ui:define name="pageTitle">Catálogo de Productos</ui:define>
    <ui:define name="pageSubtitle">Gestión de existencias y precios</ui:define>

    <ui:define name="topActions">
        <h:form>
            <p:button value="Registrar Nuevo" outcome="RegistrarProductos" icon="pi pi-plus"
                styleClass="ui-button-primary" />
        </h:form>
    </ui:define>

    <ui:define name="content">
        <div class="premium-card">
            <h:form id="form">
                <p:growl id="messages" showDetail="true" />

                <p:dataTable id="dt-products" widgetVar="dtProducts" var="product"
                    value="#{ManagerProductos.listaProductos}" reflow="true" styleClass="products-table"
                    rowKey="#{product.id_producto}" paginator="true" rows="10" paginatorPosition="bottom">

                    <f:facet name="header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: bold">PRODUCTOS</span>
                            <span class="filter-container ui-input-icon-left">
                                <i class="pi pi-search"></i>
                                <p:inputText id="globalFilter" onkeyup="PF('dtProducts').filter()"
                                    placeholder="Buscar..." />
                            </span>
                        </div>
                    </f:facet>

                    <p:column headerText="ID" sortBy="#{product.id_producto}" style="width: 5%">
                        <h:outputText value="#{product.id_producto}" />
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{product.nom_producto}" filterBy="#{product.nom_producto}"
                        filterMatchMode="contains">
                        <h:outputText value="#{product.nom_producto}" style="font-weight: bold" />
                    </p:column>

                    <p:column headerText="Categoría" sortBy="#{product.categoria}">
                        <h:outputText value="#{product.categoria}" />
                    </p:column>

                    <p:column headerText="Precio Venta" sortBy="#{product.precio}">
                        <h:outputText value="#{product.precio}" style="font-weight: bold; color: var(--accent-blue)">
                            <f:convertNumber currencySymbol="$" type="currency" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Stock" sortBy="#{product.stock}">
                        <span class="status-pill #{product.stock lt 10 ? 'warning' : 'success'}"
                            style="background: #{product.stock lt 10 ? '#fee2e2' : '#dcfce7'}; color: #{product.stock lt 10 ? '#991b1b' : '#166534'};">
                            #{product.stock}
                        </span>
                    </p:column>

                    <p:column exportable="false" style="width: 10%">
                        <p:commandButton icon="pi pi-pencil"
                            actionListener="#{ManagerProductos.verificarHierro()}"
                            update=":form:manage-product-content"
                            oncomplete="PF('manageProductDialog').show()"
                            styleClass="edit-button rounded-button ui-button-success" process="@this">
                            <f:setPropertyActionListener value="#{product}" target="#{ManagerProductos.productos}" />
                            <p:resetInput target=":form:manage-product-content" />
                        </p:commandButton>
                        <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash" process="@this"
                            oncomplete="PF('deleteProductDialog').show()">
                            <f:setPropertyActionListener value="#{product}" target="#{ManagerProductos.productos}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <!-- Dialogo de Edición -->
                <p:dialog header="Detalles del Producto" showEffect="fade" modal="true" widgetVar="manageProductDialog"
                    responsive="true" width="600">
                    <p:outputPanel id="manage-product-content" class="ui-fluid">
                        <h:panelGroup rendered="#{not empty ManagerProductos.productos}">
                            <div class="field">
                                <p:outputLabel for="name">Nombre</p:outputLabel>
                                <p:inputText id="name" value="#{ManagerProductos.productos.nom_producto}"
                                    required="true">
                                    <p:ajax event="keyup" listener="#{ManagerProductos.verificarHierro}" update="camposHierroEdit" />
                                </p:inputText>
                            </div>

                            <div class="field">
                                <p:outputLabel for="medida">Medida / Unidad</p:outputLabel>
                                <p:selectOneMenu id="medida" value="#{ManagerProductos.productos.medida}"
                                    converter="medidaConverter" required="true">
                                    <f:selectItem itemLabel="Seleccione medida" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{ManagerProductos.listaMedidas}" var="m" itemLabel="#{m.nombre}"
                                        itemValue="#{m}" />
                                    <p:ajax event="change" listener="#{ManagerProductos.verificarHierro}" update="camposHierroEdit" />
                                </p:selectOneMenu>
                            </div>

                            <h:panelGroup id="camposHierroEdit">
                                <h:panelGroup rendered="#{ManagerProductos.mostrarCamposHierro}" styleClass="field"
                                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed var(--accent-blue);">
                                    <div class="field">
                                        <p:outputLabel for="precioUnitarioHierro" value="Precio unitario (Varilla)" />
                                        <p:inputNumber id="precioUnitarioHierro" value="#{ManagerProductos.productos.precio_unitario}" symbol="$" modifyValueOnWheel="false" minValue="0" />
                                    </div>
                                    <div class="field">
                                        <p:outputLabel for="unidadesQuintalHierro" value="Varillas por quintal" />
                                        <p:inputNumber id="unidadesQuintalHierro" value="#{ManagerProductos.productos.unidadxmedida}" decimalPlaces="0" modifyValueOnWheel="false" minValue="0" />
                                    </div>
                                </h:panelGroup>
                            </h:panelGroup>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="field">
                                    <p:outputLabel for="categoria">Categoría</p:outputLabel>
                                    <p:inputText id="categoria" value="#{ManagerProductos.productos.categoria}" required="true" />
                                </div>
                                <div class="field">
                                    <p:outputLabel for="stock">Stock</p:outputLabel>
                                    <p:inputNumber id="stock" value="#{ManagerProductos.productos.stock}" required="true" modifyValueOnWheel="false" minValue="0" />
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="field">
                                    <p:outputLabel for="precioCompra">Precio de Compra</p:outputLabel>
                                    <p:inputNumber id="precioCompra" value="#{ManagerProductos.productos.precio_compra}" required="true" symbol="$" modifyValueOnWheel="false" minValue="0" />
                                </div>
                                <div class="field">
                                    <p:outputLabel for="precioVenta">Precio de Venta</p:outputLabel>
                                    <p:inputNumber id="precioVenta" value="#{ManagerProductos.productos.precio}" required="true" symbol="$" modifyValueOnWheel="false" minValue="0" />
                                </div>
                            </div>

                            <div class="field">
                                <p:outputLabel for="descripcion">Descripción</p:outputLabel>
                                <p:inputTextarea id="descripcion" value="#{ManagerProductos.productos.descripcion}" rows="2" />
                            </div>
                        </h:panelGroup>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                            actionListener="#{ManagerProductos.editarProducto()}" update="dt-products manage-product-content messages"
                            process="manage-product-content @this" oncomplete="if (!args.validationFailed) PF('manageProductDialog').hide()" />
                        <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageProductDialog').hide()"
                            class="ui-button-secondary" type="button" />
                    </f:facet>
                </p:dialog>

                <p:confirmDialog widgetVar="deleteProductDialog" showEffect="fade" width="300"
                    message="¿Eliminar este producto?" header="Confirmar" severity="warn">
                    <p:commandButton value="Sí" icon="pi pi-check"
                        actionListener="#{ManagerProductos.eliminarProducto()}" process="@this" update="@form"
                        oncomplete="PF('deleteProductDialog').hide()" />
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                        onclick="PF('deleteProductDialog').hide()" />
                </p:confirmDialog>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
