<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>Analytics Dashboard</title>
    <h:outputStylesheet name="dashboard.css" />
    <style type="text/css">
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
}

.container {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 220px;
    background-color: #2f3e4d;
    color: white;
    padding: 20px;
}

.sidebar h2 {
    font-size: 14px;
    margin-bottom: 10px;
    color: #aaa;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar li {
    padding: 10px 0;
    cursor: pointer;
}

.sidebar li.active {
    font-weight: bold;
    color: #00d4a7;
}

.dashboard {
    flex: 1;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.user-profile {
    display: flex;
    align-items: center;
}

.user-profile img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
}

.create-button {
    background-color: #00d4a7;
    color: white;
    border: none;
    padding: 10px 15px;
    font-weight: bold;
    cursor: pointer;
}

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    padding: 20px;
    border-radius: 8px;
    color: white;
}

.card h3 {
    margin: 0 0 10px;
}

.card .value {
    font-size: 24px;
    font-weight: bold;
}

.card .change {
    font-size: 14px;
}

.card.red {
    background-color: #e74c3c;
}

.card.orange {
    background-color: #f39c12;
}

.card.green {
    background-color: #2ecc71;
}

.change.down {
    color: #fdd;
}

.change.up {
    color: #dff;
}

.report-button {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

/* --- Estilos para Texto Blanco y Efecto Hover Verde Limón --- */

/* 1. Define la clase que usarás en tu XHTML */
.texto-blanco-hover-limon {
    /* Color del texto por defecto */
    color: white; 
    
    /* Asegura una transición suave al cambiar de color */
    transition: color 0.3s ease;
    
    /* Opcional: Remueve el subrayado de los enlaces si lo usas */
    text-decoration: none; 
}

/* 2. Define el estado HOVER (cuando el mouse está encima) */
.texto-blanco-hover-limon:hover {
    /* El color verde limón */
    color: #ccff00; /* Un verde amarillo brillante */
    
    /* Opcional: Cambia el cursor para indicar que es interactivo */
    cursor: pointer; 
}

/* --- Ejemplos de uso en otros elementos --- */

/* Para enlaces dentro de tu navegación lateral */
.main-nav a {
    color: white; /* Color base */
    text-decoration: none;
    transition: color 0.3s ease;
}

.main-nav a:hover {
    color: #ccff00; /* Verde limón al pasar el mouse */
}

        
    </style>
</h:head>
<h:body>
    <div class="container">
        <aside class="sidebar">
            <h2>MAIN NAVIGATION</h2>
            <ul>
                <li class="active">Inicio</li>
                <li>
                    <h:link outcome="RegistrarProductos" value="Registrar Productos" styleClass="texto-blanco-hover-limon"/>
                </li>
                <li>
                <h:link outcome="ListaProductos" value="Lista Productos" styleClass="texto-blanco-hover-limon"/>
                </li>
                <li>
                    <h:link outcome="Ventas" value="Nueva Venta" styleClass="texto-blanco-hover-limon"/>
                </li>
                <li> <h:link outcome="Clientes" value="Registrar Clientes" styleClass="texto-blanco-hover-limon"/></li>
                <li> <h:link outcome="ListaClientes" value="Lista clientes" styleClass="texto-blanco-hover-limon"/></li>
                <li> <h:link outcome="DetalleFacturas" value="Detalle facturas" styleClass="texto-blanco-hover-limon"/></li>
                
            </ul>
        </aside>

        <main class="dashboard">
            <header class="topbar">
                <div class="user-profile">
                    <img src="user.png" alt="Alina Mclourd" />
                    <div>
                        <strong>Alina Mclourd</strong><br />
                        <span>VP People Manager</span>
                    </div>
                </div>
                <h:commandButton value="+ Create New" styleClass="create-button" />
            </header>

            <section class="stats">
                <div class="card red">
                    <h3>Cash Deposits</h3>
                    <p class="value">1.7M</p>
                    <p class="change down">↓ 54.1% less earnings</p>
                </div>
                <div class="card orange">
                    <h3>Invested Dividends</h3>
                    <p class="value">#{ManagerProductos.productoMenor.nom_producto}</p>
                    <p class="change down">#{ManagerProductos.productoMenor.stock}</p>
                </div>
                <div class="card green">
                    <h3>Capital ganado</h3>
                    <p class="value">#{ManagerProductos.totalVentas}</p>
                    <p class="change up"></p>
                </div>
            </section>

            <h:commandButton value="ver Reportes Completos" styleClass="report-button" />
        </main>
    </div>
    
</h:body>
</html>
